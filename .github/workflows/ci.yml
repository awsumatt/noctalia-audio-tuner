name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: python (compile + unittest, mocked only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the backend
        run: python3 -m compileall backend
      - name: Unit tests (stdlib unittest; no hardware, no live audio)
        run: python3 -m unittest discover -s backend/tests -t backend -v
      # NOTE: this job does NOT verify runtime audio behaviour. It has no
      # sound hardware; all tests are simulated-fixture/mocked tests. No
      # measurement, switching, or apply result produced here is a claim
      # about real devices.

  ruff:
    name: ruff (CI-only linter, SA4-owned files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Scoped to the SA4 slice: SA1/SA2 files are owned by other branches
      # and were not linted there; scoping avoids failing this repo's CI on
      # files this slice must not modify (see AGENTS.md subagent rules).
      - run: |
          python -m pip install ruff
          ruff check backend/tunerlib/ab.py backend/tunerlib/commands/ab_start.py backend/tunerlib/commands/ab_switch.py backend/tunerlib/commands/ab_stop.py backend/tunerlib/commands/apply.py backend/tunerlib/commands/_common.py backend/tests/test_ab.py

  shellcheck:
    name: shellcheck (CI-only linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: backend
# NOTE: no luau job yet — plugin/ lands with SA3; its agent should add a
# luau-analyze (or luau-lsp analyze) job then, as a CI-only tool.
