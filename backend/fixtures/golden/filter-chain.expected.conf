# Speaker tuning generated by gen-filter-chain.py.
#
# 4 biquads per channel followed by a lookahead limiter. Record the
# measurements that justify these values in tuning.conf; see the
# omarchy-audio-tuner README for what a tuning has to report.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l      label = bq_highpass  control = { "Freq" = 55.0 "Q" = 0.7 } }
          { type = builtin name = s1_l      label = bq_peaking   control = { "Freq" = 100.0 "Q" = 1.2 "Gain" = 3.0 } }
          { type = builtin name = s2_l      label = bq_peaking   control = { "Freq" = 3000.0 "Q" = 1.5 "Gain" = -4.0 } }
          { type = builtin name = s3_l      label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 2.0 } }

          { type = builtin name = s0_r      label = bq_highpass  control = { "Freq" = 55.0 "Q" = 0.7 } }
          { type = builtin name = s1_r      label = bq_peaking   control = { "Freq" = 100.0 "Q" = 1.2 "Gain" = 3.0 } }
          { type = builtin name = s2_r      label = bq_peaking   control = { "Freq" = 3000.0 "Q" = 1.5 "Gain" = -4.0 } }
          { type = builtin name = s3_r      label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 2.0 } }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              # Broadband makeup from the fit, carried by the limiter's input
              # gain so no separate gain stage is needed.
              "g_in"  = 0.7842
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "limiter:in_l" }
          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
      }
    }
  }
]
